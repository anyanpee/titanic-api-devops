version: "3.9"

services:
  api:
    build:
      context: ..           # repo root
      dockerfile: Dockerfile
    image: docker-api
    container_name: titanic_api
    ports:
      - "5000:5000"
    env_file:
      - ../.env.example
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: titanic_db
    environment:
      POSTGRES_USER: titanic
      POSTGRES_PASSWORD: titanic
      POSTGRES_DB: titanic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:

    volumes:
      - ../titanic-api:/app  # Dev only

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
